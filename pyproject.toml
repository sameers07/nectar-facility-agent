[project]
name = "nectar-facility-agent"
version = "0.1.0"
description = "Voice-driven facility investigation agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
